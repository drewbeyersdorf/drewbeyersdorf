<svg xmlns="http://www.w3.org/2000/svg" width="800" height="295" viewBox="0 0 800 295">
  <rect x="1" y="1" width="798" height="293" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text x="30" y="34" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13" fill="#8b949e" letter-spacing="3">THE SELF-LEARNING LINE</text>
  <text x="770" y="34" text-anchor="end" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10" fill="#6e7681" letter-spacing="2">RUNS WEEKLY · NO HUMAN NEEDED</text>

  <!-- main belt -->
  <line x1="26" y1="110" x2="774" y2="110" stroke="#d29922" stroke-width="2" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- return belt: corrections loop back into training -->
  <path d="M710 142 V192 H248 V142" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/>
  </path>
  <text x="479" y="216" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="10" fill="#3fb950" letter-spacing="1.5">corrections loop back into training — the line teaches itself</text>

  <!-- meal boxes riding the belt -->
  <rect x="-6" y="-5" width="12" height="10" rx="1.5" fill="#d29922">
    <animateMotion dur="7s" repeatCount="indefinite" path="M26 105 H774"/>
  </rect>
  <rect x="-6" y="-5" width="12" height="10" rx="1.5" fill="#d29922">
    <animateMotion dur="7s" begin="-2.3s" repeatCount="indefinite" path="M26 105 H774"/>
  </rect>
  <rect x="-6" y="-5" width="12" height="10" rx="1.5" fill="#d29922">
    <animateMotion dur="7s" begin="-4.6s" repeatCount="indefinite" path="M26 105 H774"/>
  </rect>
  <!-- one corrected box looping back -->
  <rect x="-6" y="-5" width="12" height="10" rx="1.5" fill="#3fb950">
    <animateMotion dur="7s" repeatCount="indefinite" path="M710 147 V192 H248 V147"/>
  </rect>

  <!-- stations (drawn over the belt, boxes pass through) -->
  <g font-family="ui-monospace,'SF Mono',Menlo,monospace" text-anchor="middle">
    <rect x="30" y="80" width="128" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="94" y="106" font-size="13" font-weight="700" fill="#e6edf3" letter-spacing="2">INGEST</text>
    <text x="94" y="126" font-size="9" fill="#8b949e">everything becomes data</text>

    <rect x="184" y="80" width="128" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="248" y="106" font-size="13" font-weight="700" fill="#e6edf3" letter-spacing="2">TRAIN</text>
    <text x="248" y="126" font-size="9" fill="#8b949e">weekly auto-cycle</text>

    <rect x="338" y="80" width="128" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="402" y="106" font-size="13" font-weight="700" fill="#e6edf3" letter-spacing="2">INFER</text>
    <text x="402" y="126" font-size="9" fill="#8b949e">agents dispatched</text>

    <rect x="492" y="80" width="128" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="556" y="106" font-size="13" font-weight="700" fill="#e6edf3" letter-spacing="2">EVALUATE</text>
    <text x="556" y="126" font-size="9" fill="#8b949e">vs ground truth</text>

    <rect x="646" y="80" width="128" height="60" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="710" y="106" font-size="13" font-weight="700" fill="#e6edf3" letter-spacing="2">CORRECT</text>
    <text x="710" y="126" font-size="9" fill="#8b949e">fix, feed back</text>
  </g>

  <!-- constitution: the floor everything stands on -->
  <rect x="30" y="246" width="744" height="34" rx="6" fill="#1c2128" stroke="#d29922" stroke-dasharray="4 4"/>
  <text x="402" y="268" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5" fill="#d29922" letter-spacing="1">CONSTITUTION — rules enforced by infrastructure, not prompts</text>
</svg>
