<svg xmlns="http://www.w3.org/2000/svg" width="520" height="200">
  <defs>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8a6d3b"/>
      <stop offset="50%" style="stop-color:#c9a44a"/>
      <stop offset="100%" style="stop-color:#8a6d3b"/>
    </linearGradient>
  </defs>
  <rect width="520" height="200" rx="4" fill="#1a1a2e" stroke="url(#border)" stroke-width="2"/>
  <text font-family="monospace" font-size="14">
    <tspan x="20" y="28" fill="#ffd100" font-weight="bold">─── Guild MOTD ───────────────────</tspan>
    <tspan x="20" y="56" fill="#ffd100">san francisco taught me that the future</tspan>
    <tspan x="20" y="74" fill="#ffd100">is built by people who look crazy until</tspan>
    <tspan x="20" y="92" fill="#ffd100">they don't.</tspan>
    <tspan x="20" y="120" fill="#ffd100">the gap between "built it" and "shipped it"</tspan>
    <tspan x="20" y="138" fill="#ffd100">is where most people live their entire careers.</tspan>
    <tspan x="20" y="172" fill="#9d9d9d">private repos. public results.</tspan>
  </text>
</svg>
